<title id="title">iWani — Project Nexus | animated Android accessibility app concept</title>
<desc id="desc">Original retro Android phone preview for the iWani collaborative project, showing a subtly animated 21-landmark hand skeleton, a sample recognition alphabet, offline mode, subtitles, and an emergency SOS interface. Illustrative, not a recording of the running application.</desc>
