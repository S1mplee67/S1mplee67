<style>
@keyframes signal{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes handMotion{0%,100%{transform:translate(0px,0px) rotate(-1deg)}35%{transform:translate(2px,-4px) rotate(1.5deg)}70%{transform:translate(-3px,2px) rotate(-1.4deg)}}
@keyframes jointPulse{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes letterA{0%,30%{opacity:1}33%,100%{opacity:0}}
@keyframes letterB{0%,32%{opacity:0}34%,64%{opacity:1}67%,100%{opacity:0}}
@keyframes letterC{0%,64%{opacity:0}67%,99%{opacity:1}100%{opacity:0}}
.blink{animation:signal 2.6s ease-in-out infinite}
.hand-drift{transform-origin:863px 266px;animation:handMotion 4.8s ease-in-out infinite}
.joint{animation:jointPulse 1.8s ease-in-out infinite}
.letter-a{animation:letterA 7.5s linear infinite}
.letter-b{opacity:0;animation:letterB 7.5s linear infinite}
.letter-c{opacity:0;animation:letterC 7.5s linear infinite}
@media (prefers-reduced-motion:reduce){.blink,.hand-drift,.joint,.letter-a,.letter-b,.letter-c{animation:none!important}.letter-b,.letter-c{opacity:0!important}.letter-a{opacity:1!important}}
</style>
