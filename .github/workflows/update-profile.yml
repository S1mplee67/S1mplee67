name: Check profile artwork

on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - .github/workflows/update-profile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SVG artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          for path in Path('assets').glob('*.svg'):
              ET.parse(path)
              print('OK:', path)

          for filename in ('contribution-farm.svg', 'contribution-farm-light.svg', 'project-preview.svg'):
              text = (Path('assets') / filename).read_text(encoding='utf-8')
              if '@keyframes' not in text:
                  raise SystemExit(f'Missing animation in {filename}')
              if filename.startswith('contribution-farm'):
                  import re
                  total_match = re.search(r'(\\d+) CONTRIBUTIONS / (\\d+) DAYS', text)
                  cow_counts = [int(x) for x in re.findall(r'<title>\\d{4}-\\d{2}-\\d{2}: (\\d+) contributions?</title>', text)]
                  if (not total_match or len(cow_counts) != int(total_match.group(2))
                          or sum(cow_counts) != int(total_match.group(1))):
                      raise SystemExit(f'Contribution cow totals do not match labels in {filename}')
          PY
